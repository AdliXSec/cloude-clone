{# Macro bersama untuk halaman publik. Tampilkan gambar asli jika ada, fallback SVG. #}
{% macro thumb(i, image=None) %}
{% if image %}
<img class="thumb" src="{{ url_for('static', filename=image) }}" alt="Foto kamar" style="width:100%;height:100%;object-fit:cover;">
{% else %}
<span class="thumb thumb-{{ i % 6 }}" style="display:flex;align-items:center;justify-content:center;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:42%;height:auto;opacity:.75"><path d="M3 20V9.5L12 4l9 5.5V20"/><path d="M3 20h18"/><rect x="9" y="12" width="6" height="8" rx="1"/></svg>
</span>
{% endif %}
{% endmacro %}

{% macro back(href, label) %}
<a class="breadcrumb" href="{{ href }}">
    <svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>{{ label }}
</a>
{% endmacro %}
